<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="菜單翻譯">
  <meta name="theme-color" content="#0f171e">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>居酒屋菜單翻譯</title>
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg: #0f171e;
      --surface: #18242e;
      --surface-2: #20303c;
      --border: #2c4150;
      --text: #f2f5f7;
      --text-dim: #9fb2c0;
      --accent: #e0a856;
      --accent-press: #c9923f;
      --danger: #e06a5a;
      --danger-press: #c4523f;
      --tap: 44px; /* minimum touch target */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                   "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 17px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    /* ---------- View switching ---------- */
    .view { display: none; min-height: 100%; flex-direction: column; }
    .view.active { display: flex; }

    /* ---------- Buttons ---------- */
    button {
      font: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: var(--tap);
      padding: 10px 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { background: var(--surface); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a1205;
      font-weight: 600;
    }
    .btn-primary:active { background: var(--accent-press); border-color: var(--accent-press); }
    .btn-danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }
    .btn-danger:active { background: rgba(224,106,90,0.12); }
    .btn-ghost { background: transparent; border-color: transparent; }
    .icon-btn {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
    }

    /* ---------- Settings view ---------- */
    #view-settings { padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 24px); }
    .settings-inner { max-width: 520px; margin: 0 auto; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .lede { color: var(--text-dim); font-size: 15px; margin: 0 0 24px; }
    .lede a { color: var(--accent); }
    label { display: block; font-size: 14px; color: var(--text-dim); margin: 18px 0 6px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: var(--tap);
      padding: 10px 14px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    .row > * { flex: 1; }
    .key-state {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 8px;
    }
    .key-mask { font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; }
    .hint { color: var(--text-dim); font-size: 13px; margin-top: 8px; }
    .hidden { display: none !important; }

    /* ---------- Main view ---------- */
    #view-main { }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(var(--safe-top) + 8px) 12px 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar .title { font-size: 16px; font-weight: 600; }
    .spacer { flex: 1; }

    .main-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Empty state */
    .empty {
      padding: 48px 24px calc(var(--safe-bottom) + 24px);
      text-align: center;
      color: var(--text-dim);
    }
    .empty .big { font-size: 44px; margin-bottom: 12px; }
    .empty p { margin: 6px 0; }

    /* ---------- Image area (sticky, collapsible) ---------- */
    #image-area {
      padding: 8px 12px 8px;
      position: sticky; top: 0; z-index: 6;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .image-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .image-head-title { font-size: 14px; color: var(--text-dim); }
    .image-toggle {
      margin-left: auto;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 10px;
    }
    /* 限高視窗：圖太長時於框內自行捲動，清單仍同畫面可見 */
    .image-wrap {
      width: 100%;
      max-height: 42vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #000;
    }
    .image-wrap.collapsed { display: none; }
    /* 疊框的定位基準：與 <img> 同尺寸，box_2d 百分比才對齊 */
    .image-stage { position: relative; width: 100%; }
    #menu-img { display: block; width: 100%; height: auto; }

    /* 高亮框（§7 百分比疊框）— 淡顯且可點 */
    .hl-box {
      position: absolute;
      border: 1.5px solid rgba(224,168,86,0.4);
      border-radius: 4px;
      background: transparent;
      pointer-events: auto;
      cursor: pointer;
      box-sizing: border-box;
    }
    .hl-box.active {
      border-width: 2.5px;
      border-color: var(--accent);
      background: rgba(224,168,86,0.18);
    }
    .hl-box.flash { animation: hlflash 0.9s ease-out 2; }
    @keyframes hlflash {
      0%, 100% { background: rgba(224,168,86,0.18); }
      50%      { background: rgba(224,168,86,0.55); }
    }

    /* 翻譯字幕條 */
    .image-cap {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: 12px;
    }
    .image-cap[hidden] { display: none; }
    .cap-main { flex: 1; min-width: 0; }
    .cap-zh { font-size: 16px; font-weight: 700; }
    .cap-jp { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    .cap-price { font-size: 15px; white-space: nowrap; }

    /* ---------- List area ---------- */
    #list-area { padding: 4px 12px calc(var(--safe-bottom) + 24px); }

    .result-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 2px 4px;
    }
    .source-tag {
      font-size: 13px; color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .pro-retry-btn {
      margin-left: auto;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 10px;
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
      white-space: nowrap;
    }
    .pro-retry-btn:active { background: rgba(224,168,86,0.12); }
    .pro-retry-btn:disabled { opacity: 0.5; }

    .cat-group { margin-top: 14px; }
    .cat-title {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 15px; font-weight: 700; color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px; margin-bottom: 4px;
    }
    .cat-jp { font-size: 12px; font-weight: 400; color: var(--text-dim); }

    .item-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(44,65,80,0.5);
      min-height: var(--tap);
      cursor: pointer;
    }
    .item-row:active { background: var(--surface); }
    .item-row.sel { background: rgba(224,168,86,0.12); }
    .item-main { flex: 1; min-width: 0; }
    .item-zh {
      font-size: 16px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .item-jp { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    .item-price { font-size: 15px; color: var(--text); white-space: nowrap; }
    .badge-unusual {
      font-size: 11px; color: var(--accent);
      border: 1px solid var(--accent); border-radius: 6px;
      padding: 0 5px; font-weight: 500; white-space: nowrap;
    }
    .ai-note {
      font-size: 12px; color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      margin: 8px 2px 2px;
      line-height: 1.5;
    }
    .info-btn {
      font-size: 20px; color: var(--text-dim);
      background: transparent; border-color: transparent;
      min-width: var(--tap); min-height: var(--tap);
    }

    /* ---------- Inline error card (§10, retryable, no white screen) ---------- */
    .error-card {
      margin: 24px 4px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--danger);
      border-radius: 14px;
      text-align: center;
    }
    .error-card .emoji { font-size: 30px; }
    .error-card .msg { margin: 8px 0 14px; color: var(--text); }
    .error-card .actions { display: flex; gap: 10px; justify-content: center; }

    /* ---------- Toast (transient, non-blocking) ---------- */
    #toast {
      position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px);
      transform: translateX(-50%) translateY(20px);
      max-width: 88%;
      background: #2a3a26; color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px; font-size: 14px; line-height: 1.5;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.danger { background: #3a2622; }

    /* ---------- Bottom sheet (§6) ---------- */
    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 40;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--surface);
      border-top-left-radius: 18px; border-top-right-radius: 18px;
      border-top: 1px solid var(--border);
      padding: 8px 18px calc(var(--safe-bottom) + 20px);
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 41;
      max-height: 80vh; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sheet.show { transform: translateY(0); }
    .sheet-grip {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 6px auto 10px;
    }
    .sheet-head { display: flex; align-items: flex-start; gap: 10px; }
    .sheet-titles { flex: 1; min-width: 0; }
    .sheet-title { font-size: 18px; font-weight: 700; }
    .sheet-sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .sheet-body { font-size: 16px; line-height: 1.7; margin-top: 12px; min-height: 48px; }
    .sheet-body.loading { color: var(--text-dim); }
    .sheet-body .retry-link {
      color: var(--accent); text-decoration: underline; cursor: pointer;
    }

    /* ---------- Processing overlay ---------- */
    #busy {
      position: fixed; inset: 0;
      background: rgba(8,12,16,0.72);
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      z-index: 50;
      color: var(--text);
    }
    #busy.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #busy .busy-text { font-size: 15px; color: var(--text-dim); }
  </style>
</head>
<body>

  <!-- ================= 設定頁 ================= -->
  <section id="view-settings" class="view">
    <div class="settings-inner">
      <h1>居酒屋菜單翻譯</h1>
      <p class="lede">
        拍一張日本菜單照片，翻成繁體中文並可在原圖上定位。
        需要一組免費的 Gemini API key，可至
        <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a>
        免費取得。
      </p>

      <!-- 尚無 key：輸入區 -->
      <div id="key-input-block">
        <label for="key-input">貼上你的 Gemini API key</label>
        <input id="key-input" type="password" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="AIza...">
        <div class="row">
          <button id="save-key-btn" class="btn-primary">儲存</button>
        </div>
        <p class="hint">key 只會存在這支裝置的瀏覽器（localStorage），不會上傳或外送。</p>
      </div>

      <!-- 已有 key：遮罩 + 清除 -->
      <div id="key-saved-block" class="hidden">
        <label>目前的 API key</label>
        <div class="key-state">
          <span class="key-mask" id="key-mask"></span>
        </div>
        <div class="row">
          <button id="go-main-btn" class="btn-primary">開始使用</button>
          <button id="clear-key-btn" class="btn-danger">清除 key</button>
        </div>
        <p class="hint">若翻譯一直顯示 key 無效，可清除後重新貼上。</p>
      </div>
    </div>
  </section>

  <!-- ================= 主畫面 ================= -->
  <section id="view-main" class="view">
    <div class="topbar">
      <span class="title">菜單翻譯</span>
      <span class="spacer"></span>
      <!-- 拍照／選圖：不帶 capture，iOS 會同時提供「拍照」與「照片圖庫」 -->
      <label class="icon-btn" for="file-input" aria-label="拍照或選圖" role="button">📷</label>
      <input id="file-input" type="file" accept="image/*" class="hidden">
      <button id="settings-btn" class="icon-btn btn-ghost" aria-label="設定">⚙️</button>
    </div>

    <div class="main-scroll">
      <!-- 原圖區（釘在上方、可收合，預設展開） -->
      <div id="image-area" class="hidden">
        <div class="image-head">
          <span class="image-head-title">原始菜單</span>
          <button id="toggle-image-btn" class="btn-ghost image-toggle">收合 ▲</button>
        </div>
        <div id="image-wrap" class="image-wrap">
          <div id="image-stage" class="image-stage">
            <img id="menu-img" alt="正規化後的菜單照片">
            <!-- 高亮框由 JS 插入於此 -->
          </div>
        </div>
        <!-- 翻譯字幕條：點圖上的框或清單品項時顯示對應翻譯 -->
        <div id="image-cap" class="image-cap" hidden>
          <div class="cap-main">
            <div class="cap-zh" id="cap-zh"></div>
            <div class="cap-jp" id="cap-jp"></div>
          </div>
          <span class="cap-price" id="cap-price"></span>
          <button class="icon-btn info-btn" id="cap-info" aria-label="料理說明">ⓘ</button>
        </div>
      </div>
      <!-- 清單區（Stage 3 接上） -->
      <div id="list-area"></div>
      <!-- 空狀態引導 -->
      <div id="empty-state" class="empty">
        <div class="big">📷</div>
        <p>還沒有菜單。</p>
        <p>點右上角相機，拍一張或選一張日本菜單照片。</p>
      </div>
    </div>
  </section>

  <!-- 料理說明 sheet（由下滑出） -->
  <div id="sheet-backdrop" class="sheet-backdrop" aria-hidden="true"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-titles">
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-sub" id="sheet-sub"></div>
      </div>
      <button id="sheet-close" class="icon-btn btn-ghost" aria-label="關閉">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- 輕量提示 -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- 處理中遮罩 -->
  <div id="busy">
    <div class="spinner"></div>
    <div class="busy-text" id="busy-text">處理中…</div>
  </div>

  <script>
  "use strict";
  /* =========================================================
   * 易改常數（建置時可調整）
   * =======================================================*/
  const FLASH_MODEL = "gemini-3.5-flash";           // 預設、免費；官方現行穩定 Flash（2026-06 確認）
  // 手動高精度重試。向官方文件確認（2026-06）：Developer API 現行 Pro 為 gemini-3.1-pro-preview
  // （ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview）。需 key 所屬專案開通付費。
  const PRO_MODEL   = "gemini-3.1-pro-preview";
  const API_BASE    = "https://generativelanguage.googleapis.com/v1beta/models";
  const MAX_LONG_EDGE = 2048;                        // 影像長邊上限（px）
  const JPEG_QUALITY  = 0.85;
  // 思考等級：minimal/low/medium/high。
  // 解析需要 box_2d 定位 → 維持較高(medium)以保住「點圖跳翻譯」；說明為純文字 → 用 low 加速（§5.2）。
  const PARSE_THINKING_LEVEL = "medium";
  const EXPLAIN_THINKING_LEVEL = "low";
  const PARSE_TIMEOUT_MS = 45000;                    // 解析（含送圖）單次逾時
  const TEXT_TIMEOUT_MS  = 30000;                    // 純文字說明單次逾時
  const LS_KEY = "izakaya.geminiKey";                // localStorage 鍵名

  /* 解析菜單的 prompt（§5.3） */
  const PARSE_PROMPT = `你是日本餐廳菜單的翻譯與結構化引擎。輸入是一張菜單照片，可能是紙本、黑板或牆面手寫，
可能含手寫字、反光或斜角拍攝。

請完成：
1. 辨識菜單上所有品項，包含手寫字。
2. 依菜單原有分類分組；若沒有分類，全部歸入一個 category_zh 為「未分類」的群組。
3. 將每個分類名稱與品項名稱翻譯成「繁體中文、台灣用語」。嚴禁簡體字、香港或中國大陸用語。
4. 為每個品項標出其文字在圖片上的位置 box_2d，格式 [ymin, xmin, ymax, xmax]，
   數值為相對整張圖、正規化到 0 至 1000 的整數（y 在前）。框可略寬，求涵蓋該品項文字即可。
5. 若某品項對外國旅客明顯冷門或不易理解，is_unusual 設為 true，否則 false。
6. 讀不出或不確定的字，name_jp 盡量保留原樣，name_zh 盡力翻譯，
   無法判讀則於 name_zh 標註「（難以辨識）」。
7. 不得杜撰菜單上不存在的品項。價格若無則為 null。

只輸出符合 schema 的 JSON，不要任何額外文字、說明或 markdown 標記。`;

  /* 料理說明的 prompt（§6）；以品項名稱代入 */
  function explainPrompt(item) {
    return "用繁體中文（台灣用語，禁簡體與大陸用語）向台灣旅客說明這道日本料理：\n" +
      (item.name_jp || "") + "（" + (item.name_zh || "") + "）。\n" +
      "請說明：它是什麼、口感與風味特色、常見吃法。3 至 4 句，口語、實用，不要寒暄。";
  }
  const PARSE_SCHEMA = {
    type: "object",
    properties: {
      categories: {
        type: "array",
        items: {
          type: "object",
          properties: {
            category_jp: { type: "string" },
            category_zh: { type: "string" },
            items: {
              type: "array",
              items: {
                type: "object",
                properties: {
                  id: { type: "string" },
                  name_jp: { type: "string" },
                  name_zh: { type: "string" },
                  price: { type: "string", nullable: true },
                  box_2d: { type: "array", items: { type: "integer" }, minItems: 4, maxItems: 4 },
                  is_unusual: { type: "boolean" }
                },
                required: ["id", "name_jp", "name_zh", "box_2d", "is_unusual"]
              }
            }
          },
          required: ["category_zh", "items"]
        }
      }
    },
    required: ["categories"]
  };

  /* =========================================================
   * 應用狀態
   * =======================================================*/
  const state = {
    apiKey: null,
    imageDataUrl: null,   // 正規化後的 JPEG dataURL（同一張用於顯示與送 Gemini）
    imageBase64: null,    // 上者去掉 data: 前綴的純 base64
    imageW: 0,
    imageH: 0,
    menu: null,           // 解析結果 { categories: [...] }
    modelSource: null,    // 'flash' | 'pro'，目前結果來源
    selectedId: null,     // 目前選取的品項 id
  };

  /* =========================================================
   * 處理中遮罩
   * =======================================================*/
  function setBusy(on, text) {
    const el = document.getElementById("busy");
    if (text) document.getElementById("busy-text").textContent = text;
    el.classList.toggle("show", !!on);
  }

  /* 輕量提示（暫時、非阻斷） */
  let _toastTimer = null;
  function showToast(text, danger) {
    const el = document.getElementById("toast");
    el.textContent = text;
    el.classList.toggle("danger", !!danger);
    el.classList.add("show");
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("show"), 4200);
  }

  /* =========================================================
   * View 切換
   * =======================================================*/
  function showView(name) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
    window.scrollTo(0, 0);
  }

  /* =========================================================
   * API key 管理（localStorage）
   * =======================================================*/
  function loadKey() {
    try { return localStorage.getItem(LS_KEY) || null; }
    catch (e) { return null; }
  }
  function saveKey(k) {
    try { localStorage.setItem(LS_KEY, k); } catch (e) {}
    state.apiKey = k;
  }
  function clearKey() {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    state.apiKey = null;
  }
  function maskKey(k) {
    if (!k) return "";
    if (k.length <= 10) return k.slice(0, 2) + "••••••";
    return k.slice(0, 4) + "••••••" + k.slice(-4);
  }

  /* 依目前是否有 key，切換設定頁的兩個區塊 */
  function renderSettings() {
    const hasKey = !!state.apiKey;
    document.getElementById("key-input-block").classList.toggle("hidden", hasKey);
    document.getElementById("key-saved-block").classList.toggle("hidden", !hasKey);
    if (hasKey) document.getElementById("key-mask").textContent = maskKey(state.apiKey);
    document.getElementById("key-input").value = "";
  }

  /* =========================================================
   * 影像正規化（§4）
   *  - 修正 EXIF 方向
   *  - 等比縮放至長邊 <= MAX_LONG_EDGE
   *  - 輸出 image/jpeg（品質 JPEG_QUALITY）的 dataURL
   * 送 Gemini 與畫面顯示用「同一張」結果，box_2d 才不會錯位。
   * =======================================================*/
  async function decodeOriented(file) {
    // 優先用 createImageBitmap 並要求依 EXIF 轉正
    if (typeof createImageBitmap === "function") {
      try {
        return await createImageBitmap(file, { imageOrientation: "from-image" });
      } catch (e) {
        // 部分舊版 Safari 不支援該選項，退回不帶 options
        try { return await createImageBitmap(file); } catch (e2) {}
      }
    }
    // 最終退路：用 <img> 載入（現代 iOS Safari 對 <img> 已自動套用 EXIF 方向）
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("無法載入影像"));
      img.src = URL.createObjectURL(file);
    });
  }

  async function normalizeImage(file) {
    const src = await decodeOriented(file);
    const sw = src.width, sh = src.height;
    const scale = Math.min(1, MAX_LONG_EDGE / Math.max(sw, sh));
    const dw = Math.round(sw * scale);
    const dh = Math.round(sh * scale);

    const canvas = document.createElement("canvas");
    canvas.width = dw;
    canvas.height = dh;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(src, 0, 0, dw, dh);
    if (src.close) src.close(); // 釋放 ImageBitmap

    const dataUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
    return {
      dataUrl,
      base64: dataUrl.slice(dataUrl.indexOf(",") + 1),
      w: dw,
      h: dh,
    };
  }

  /* 顯示正規化後影像於原圖區 */
  function showImage(dataUrl) {
    document.getElementById("menu-img").src = dataUrl;
    document.getElementById("image-area").classList.remove("hidden");
    document.getElementById("empty-state").classList.add("hidden");
    setImageCollapsed(false); // 新圖預設展開
  }

  /* 原圖區收合／展開 */
  function setImageCollapsed(collapsed) {
    document.getElementById("image-wrap").classList.toggle("collapsed", collapsed);
    document.getElementById("toggle-image-btn").textContent =
      collapsed ? "展開 ▼" : "收合 ▲";
  }
  function toggleImage() {
    const wrap = document.getElementById("image-wrap");
    setImageCollapsed(!wrap.classList.contains("collapsed"));
  }

  /* =========================================================
   * Gemini REST 呼叫（§5）
   * =======================================================*/
  // 帶 HTTP 狀態碼的錯誤，供上層對應錯誤訊息
  class ApiError extends Error {
    constructor(message, status) { super(message); this.status = status; }
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  async function geminiGenerate(model, parts, generationConfig, opts) {
    if (!state.apiKey) throw new ApiError("尚未設定 API key", 401);
    opts = opts || {};
    const timeoutMs = opts.timeoutMs || 30000;
    const MAX_TRIES = opts.tries || 2;
    const url = API_BASE + "/" + model + ":generateContent";
    const body = JSON.stringify({ contents: [{ parts }], generationConfig });

    // 對暫時性失敗（連線中斷／逾時／5xx 伺服器忙碌）自動重試，短退避。
    let lastErr = null;
    for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
      if (attempt > 1) await sleep(800 * (attempt - 1));
      let resp;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        resp = await fetch(url, {
          method: "POST",
          headers: {
            "x-goog-api-key": state.apiKey,
            "Content-Type": "application/json",
          },
          body,
          signal: ctrl.signal,
        });
      } catch (netErr) {
        // 逾時(abort) 或連線失敗（含 CORS 被擋的暫時性錯誤）
        lastErr = new ApiError("network", 0);
        continue; // 重試
      } finally {
        clearTimeout(timer);
      }
      // 5xx 多為暫時性伺服器忙碌 → 重試
      if (resp.status >= 500 && resp.status <= 599) {
        lastErr = new ApiError("server", resp.status);
        continue;
      }
      if (!resp.ok) {
        let detail = "";
        try { detail = (await resp.json()).error?.message || ""; } catch (e) {}
        throw new ApiError(detail || ("HTTP " + resp.status), resp.status);
      }
      const data = await resp.json();
      const cand = data.candidates && data.candidates[0];
      const text = cand && cand.content && cand.content.parts
        ? cand.content.parts.map(p => p.text || "").join("")
        : "";
      return text;
    }
    throw lastErr; // 重試用盡仍失敗
  }

  /* 解析菜單（首次或 Pro 重試共用） */
  async function parseMenu(model) {
    const parts = [
      { inline_data: { mime_type: "image/jpeg", data: state.imageBase64 } },
      { text: PARSE_PROMPT },
    ];
    const generationConfig = {
      response_mime_type: "application/json",
      response_schema: PARSE_SCHEMA,
    };
    // Flash 解析維持較高思考以保住 box_2d 定位準度；Pro 維持預設
    if (model === FLASH_MODEL) {
      generationConfig.thinkingConfig = { thinkingLevel: PARSE_THINKING_LEVEL };
    }
    const raw = await geminiGenerate(model, parts, generationConfig, { timeoutMs: PARSE_TIMEOUT_MS, tries: 3 });
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      console.error("JSON 解析失敗，原始回應：", raw);
      throw new ApiError("badjson", -1);
    }
    if (!parsed || !Array.isArray(parsed.categories)) {
      console.error("回應結構異常：", parsed);
      throw new ApiError("badjson", -1);
    }
    return normalizeMenu(parsed);
  }

  /* 補上唯一 id（§5.4 註）並保留既有 explanation 快取無關 */
  function normalizeMenu(parsed) {
    let n = 0;
    parsed.categories.forEach(cat => {
      if (!Array.isArray(cat.items)) cat.items = [];
      cat.items.forEach(item => {
        if (!item.id) item.id = "i" + (n++);
      });
    });
    return parsed;
  }

  /* =========================================================
   * 清單渲染（§3.2）
   * =======================================================*/
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMenu() {
    const listArea = document.getElementById("list-area");
    if (!state.menu) { listArea.innerHTML = ""; return; }
    // 重新渲染（含 Pro 重試）會換掉品項 id，重置選取與字幕條
    state.selectedId = null;
    document.getElementById("image-cap").hidden = true;

    const cats = state.menu.categories || [];
    let html = "";
    let hasUnusual = false;

    // 結果來源列 + 高精度(Pro)重試（§3.2 / §5.5）
    const srcLabel = state.modelSource === "pro" ? "Pro（高精度）" : "Flash";
    html += '<div class="result-head">';
    html += '<span class="source-tag" id="source-tag">目前結果來源：' + srcLabel + "</span>";
    html += '<button id="pro-retry-btn" class="pro-retry-btn">高精度(Pro)重試</button>';
    html += "</div>";

    let body = "";
    cats.forEach(cat => {
      const zh = escapeHtml(cat.category_zh || "未分類");
      const jp = cat.category_jp ? '<span class="cat-jp">' + escapeHtml(cat.category_jp) + "</span>" : "";
      body += '<div class="cat-group">';
      body += '<div class="cat-title">' + zh + jp + "</div>";
      (cat.items || []).forEach(item => {
        const price = item.price != null && item.price !== ""
          ? '<span class="item-price">' + escapeHtml(item.price) + "</span>" : "";
        let unusual = "";
        if (item.is_unusual) {
          hasUnusual = true;
          unusual = '<span class="badge-unusual">值得一試</span>';
        }
        body += '<div class="item-row" data-id="' + escapeHtml(item.id) + '">';
        body += '  <div class="item-main">';
        body += '    <div class="item-zh">' + escapeHtml(item.name_zh) + unusual + "</div>";
        body += '    <div class="item-jp">' + escapeHtml(item.name_jp) + "</div>";
        body += "  </div>";
        body += price;
        body += '  <button class="icon-btn info-btn" data-id="' + escapeHtml(item.id) +
                '" aria-label="料理說明">ⓘ</button>';
        body += "</div>";
      });
      body += "</div>";
    });

    // AI 加註提示（僅在有被標記的品項時顯示，說明非原菜單內容）
    if (hasUnusual) {
      html += '<div class="ai-note">「值得一試」為 AI 自動標註的少見／特色料理提示，非原菜單內容。</div>';
    }
    html += body;

    listArea.innerHTML = html;
    renderBoxes(); // 同步建立原圖高亮框
    // ⓘ 說明事件於 Stage 5 接上
  }

  /* =========================================================
   * 功能二：百分比疊框 + 點選定位（§7）
   * =======================================================*/
  // 驗證 box_2d 並換算百分比；不合法回 null（graceful degrade）
  function boxToStyle(box) {
    if (!Array.isArray(box) || box.length !== 4) return null;
    const [ymin, xmin, ymax, xmax] = box;
    if ([ymin, xmin, ymax, xmax].some(v => typeof v !== "number" || !isFinite(v))) return null;
    if (ymax <= ymin || xmax <= xmin) return null;
    return {
      top:    (ymin / 10) + "%",
      left:   (xmin / 10) + "%",
      height: ((ymax - ymin) / 10) + "%",
      width:  ((xmax - xmin) / 10) + "%",
    };
  }

  // 依目前菜單在原圖區建立淡顯、可點的高亮框（每個有效 box 一個）
  function renderBoxes() {
    const stage = document.getElementById("image-stage");
    // 清除舊框，保留 <img>
    stage.querySelectorAll(".hl-box").forEach(el => el.remove());
    if (!state.menu) return;
    state.menu.categories.forEach(cat => {
      (cat.items || []).forEach(item => {
        const st = boxToStyle(item.box_2d);
        item._hasBox = !!st;
        if (!st) return;
        const div = document.createElement("div");
        div.className = "hl-box";
        div.dataset.id = item.id;
        div.style.top = st.top;
        div.style.left = st.left;
        div.style.height = st.height;
        div.style.width = st.width;
        stage.appendChild(div);
      });
    });
  }

  // 統一選取：標記框 + 字幕條 + 清單列同步（雙向共用）
  function selectItem(id, opts) {
    opts = opts || {};
    const item = findItem(id);
    if (!item) return;
    state.selectedId = id;

    setImageCollapsed(false); // 確保原圖展開

    // 框：清除舊的，標記新的
    const stage = document.getElementById("image-stage");
    stage.querySelectorAll(".hl-box.active").forEach(el => el.classList.remove("active", "flash"));
    const box = stage.querySelector('.hl-box[data-id="' + cssEscape(id) + '"]');
    if (box) {
      box.classList.add("active");
      void box.offsetWidth; // 重啟動畫
      box.classList.add("flash");
      // 將框捲入限高視窗內（圖很長時）；nearest 以免連帶捲動下方清單
      box.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
    }

    // 字幕條：顯示翻譯（即使該品項無框也照顯示）
    document.getElementById("cap-zh").textContent = item.name_zh || "";
    document.getElementById("cap-jp").textContent = item.name_jp || "";
    const capPrice = document.getElementById("cap-price");
    capPrice.textContent = (item.price != null && item.price !== "") ? item.price : "";
    document.getElementById("image-cap").hidden = false;

    // 清單列：標記選取並（若由圖片觸發）捲到該列
    const listArea = document.getElementById("list-area");
    listArea.querySelectorAll(".item-row.sel").forEach(el => el.classList.remove("sel"));
    const row = listArea.querySelector('.item-row[data-id="' + cssEscape(id) + '"]');
    if (row) {
      row.classList.add("sel");
      if (opts.scrollList) row.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  // 簡易 CSS 屬性選擇器跳脫（id 由前端產生，通常為 i0.. 但仍防一手）
  function cssEscape(s) {
    return String(s).replace(/["\\\]]/g, "\\$&");
  }

  /* 依品項 id 找出 item 物件 */
  function findItem(id) {
    if (!state.menu) return null;
    for (const cat of state.menu.categories) {
      for (const item of (cat.items || [])) {
        if (item.id === id) return item;
      }
    }
    return null;
  }

  /* =========================================================
   * 功能三：料理說明 sheet（§6）
   * =======================================================*/
  function openSheet() {
    document.getElementById("sheet-backdrop").classList.add("show");
    document.getElementById("sheet").classList.add("show");
  }
  function closeSheet() {
    document.getElementById("sheet-backdrop").classList.remove("show");
    document.getElementById("sheet").classList.remove("show");
  }

  function renderExplanation(text) {
    const body = document.getElementById("sheet-body");
    body.classList.remove("loading");
    body.textContent = text;
  }

  async function explainItem(id) {
    const item = findItem(id);
    if (!item) return;

    // 標題：name_zh（主）、name_jp（小字）
    document.getElementById("sheet-title").textContent = item.name_zh || item.name_jp || "";
    document.getElementById("sheet-sub").textContent = item.name_jp || "";
    const body = document.getElementById("sheet-body");
    openSheet();

    // 已快取則直接顯示，不重複呼叫
    if (item.explanation) { renderExplanation(item.explanation); return; }

    body.classList.add("loading");
    body.textContent = "說明產生中…";
    try {
      const text = await geminiGenerate(
        FLASH_MODEL,
        [{ text: explainPrompt(item) }],
        { thinkingConfig: { thinkingLevel: EXPLAIN_THINKING_LEVEL } }, // 純文字、降思考加速
        { timeoutMs: TEXT_TIMEOUT_MS, tries: 2 }
      );
      const trimmed = (text || "").trim();
      if (!trimmed) throw new ApiError("badjson", -1);
      item.explanation = trimmed; // 快取進該品項物件（§6）
      renderExplanation(trimmed);
    } catch (e) {
      console.error(e);
      body.classList.remove("loading");
      body.innerHTML = escapeHtml(messageForError(e)) +
        ' <span class="retry-link" data-id="' + escapeHtml(id) + '">重試</span>';
    }
  }

  /* =========================================================
   * 處理選圖：正規化 → 顯示 → Gemini 解析（Flash）→ 渲染
   * =======================================================*/
  async function handleFile(file) {
    if (!file) return;
    setBusy(true, "處理影像中…");
    try {
      const norm = await normalizeImage(file);
      state.imageDataUrl = norm.dataUrl;
      state.imageBase64  = norm.base64;
      state.imageW = norm.w;
      state.imageH = norm.h;
      // 新照片：清掉舊結果與選取狀態再顯示
      state.menu = null;
      state.modelSource = null;
      state.selectedId = null;
      document.getElementById("list-area").innerHTML = "";
      document.getElementById("image-cap").hidden = true;
      showImage(norm.dataUrl);
    } catch (e) {
      console.error(e);
      setBusy(false);
      showToast("影像處理失敗，請重拍或換一張。", true);
      return;
    }
    await runFlashParse();
  }

  /* 以 Flash 解析目前影像並渲染；失敗顯示行內可重試錯誤卡（§10，不白屏） */
  async function runFlashParse() {
    if (!state.imageBase64) return;
    setBusy(true, "辨識與翻譯中…");
    try {
      const menu = await parseMenu(FLASH_MODEL);
      state.menu = menu;
      state.modelSource = "flash";
      renderMenu();
    } catch (e) {
      console.error(e);
      showParseError(e);
    } finally {
      setBusy(false);
    }
  }

  /* 主解析失敗 → 行內錯誤卡（保留原圖、可重試；key 問題另給前往設定） */
  function showParseError(e) {
    const listArea = document.getElementById("list-area");
    const keyIssue = isKeyError(e);
    let actions = '<button class="btn-primary" id="err-retry">重試</button>';
    if (keyIssue) actions += '<button id="err-settings">前往設定</button>';
    listArea.innerHTML =
      '<div class="error-card">' +
      '  <div class="emoji">⚠️</div>' +
      '  <div class="msg">' + escapeHtml(messageForError(e)) + "</div>" +
      '  <div class="actions">' + actions + "</div>" +
      "</div>";
    const retry = document.getElementById("err-retry");
    if (retry) retry.addEventListener("click", runFlashParse);
    const goSettings = document.getElementById("err-settings");
    if (goSettings) goSettings.addEventListener("click", () => {
      renderSettings();
      showView("settings");
    });
  }

  /* =========================================================
   * 模型升級：手動 Pro 重試（§5.5）
   *  - 對同一張正規化影像以 PRO_MODEL 重跑 §5 解析，成功則覆蓋結果
   *  - 未開通付費（403/PERMISSION_DENIED）→ 提示開通帳單，保留原 Flash 結果
   * =======================================================*/
  async function retryWithPro() {
    if (!state.imageBase64) return;
    setBusy(true, "高精度(Pro)辨識中…");
    try {
      const menu = await parseMenu(PRO_MODEL);
      state.menu = menu;          // 覆蓋結果
      state.modelSource = "pro";
      renderMenu();
    } catch (e) {
      console.error(e);
      // Pro 專屬 403：key 所屬專案未開通付費（保留 Flash 結果，不清空）
      if (e && e.status === 403) {
        showToast("此 API key 未開通付費方案，無法使用高精度模型；" +
              "請至 Google AI Studio 開啟帳單，或繼續使用免費結果。", true);
      } else {
        showToast(messageForError(e), true);
      }
      // 不動 state.menu / modelSource，原結果保留
    } finally {
      setBusy(false);
    }
  }

  /* 是否為 API key 類錯誤（一般 401/403） */
  function isKeyError(e) {
    return e && (e.status === 401 || e.status === 403);
  }

  /* 錯誤碼 → 使用者訊息（§10） */
  function messageForError(e) {
    const s = e && e.status;
    if (s === 0) {
      return (typeof navigator !== "undefined" && navigator.onLine === false)
        ? "目前沒有網路連線，請確認手機已連上網路後再試。"
        : "連線伺服器失敗（可能網路不穩或伺服器忙碌），請再試一次。";
    }
    if (s >= 500 && s <= 599) return "伺服器忙碌或暫時無法使用，請稍後再試。";
    if (s === 401 || s === 403) return "API key 無效，請至設定重新輸入。";
    if (s === 429) return "呼叫太頻繁或已達免費額度上限，請稍後再試。";
    if (e && e.message === "badjson") return "辨識結果格式異常，請重拍或重試。";
    return "發生錯誤，請重試。";
  }

  /* =========================================================
   * 事件綁定
   * =======================================================*/
  function bindEvents() {
    document.getElementById("save-key-btn").addEventListener("click", () => {
      const v = document.getElementById("key-input").value.trim();
      if (!v) { alert("請先貼上 API key。"); return; }
      saveKey(v);
      renderSettings();
      showView("main");
    });

    document.getElementById("go-main-btn").addEventListener("click", () => {
      showView("main");
    });

    document.getElementById("clear-key-btn").addEventListener("click", () => {
      if (!confirm("確定要清除已儲存的 API key 嗎？")) return;
      clearKey();
      renderSettings();
    });

    document.getElementById("settings-btn").addEventListener("click", () => {
      renderSettings();
      showView("settings");
    });

    const fileInput = document.getElementById("file-input");
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      fileInput.value = ""; // 允許重選同一檔
      handleFile(file);
    });

    document.getElementById("toggle-image-btn").addEventListener("click", toggleImage);

    // 點圖上的框 → 選取該品項（並把清單捲到該列）
    document.getElementById("image-stage").addEventListener("click", (e) => {
      const box = e.target.closest(".hl-box");
      if (box) selectItem(box.dataset.id, { scrollList: true });
    });

    // 字幕條的 ⓘ → 該品項說明
    document.getElementById("cap-info").addEventListener("click", () => {
      if (state.selectedId) explainItem(state.selectedId);
    });

    // 清單事件委派：Pro 重試／ⓘ 說明／點品項列 → 選取定位
    document.getElementById("list-area").addEventListener("click", (e) => {
      if (e.target.closest("#pro-retry-btn")) {
        retryWithPro();
        return;
      }
      const infoBtn = e.target.closest(".info-btn");
      if (infoBtn) {
        explainItem(infoBtn.dataset.id);
        return;
      }
      const row = e.target.closest(".item-row");
      if (row) selectItem(row.dataset.id);
    });

    // 料理說明 sheet：關閉與重試
    document.getElementById("sheet-close").addEventListener("click", closeSheet);
    document.getElementById("sheet-backdrop").addEventListener("click", closeSheet);
    document.getElementById("sheet-body").addEventListener("click", (e) => {
      const retry = e.target.closest(".retry-link");
      if (retry) explainItem(retry.dataset.id);
    });
  }

  /* =========================================================
   * 啟動
   * =======================================================*/
  function init() {
    state.apiKey = loadKey();
    bindEvents();
    renderSettings();
    showView(state.apiKey ? "main" : "settings");
  }

  init();
  </script>
</body>
</html>
